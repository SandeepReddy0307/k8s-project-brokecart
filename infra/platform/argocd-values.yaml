configs:
  cm:
    url: https://argocd.brokecart.com:8443
    resource.customizations.health.argoproj.io_Application: |
      local health = {status = "Progressing", message = "Waiting for child Application"}
      if not obj.status then return health end
      if obj.status.operationState then
        local phase = obj.status.operationState.phase
        if phase == "Running" or phase == "Terminating" then
          health.message = "Child sync and provisioning hooks are running"
          return health
        elseif phase == "Failed" or phase == "Error" then
          health.status = "Degraded"
          health.message = obj.status.operationState.message or "Child sync failed"
          return health
        end
      end
      if not obj.status.sync or obj.status.sync.status ~= "Synced" then
        health.message = "Child Application is not synced"
        return health
      end
      if obj.status.health then
        health.status = obj.status.health.status
        health.message = obj.status.health.message or ""
      end
      return health

    resource.customizations.health.external-secrets.io_SecretStore: |
      local health = {
        status = "Progressing",
        message = "Waiting for SecretStore readiness"
      }

      if obj.status and obj.status.conditions then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            health.message = condition.message or condition.reason or ""

            if condition.status == "True" then
              health.status = "Healthy"
            elseif condition.status == "False" then
              health.status = "Degraded"
            end

            return health
          end
        end
      end

      return health

    resource.customizations.health.external-secrets.io_ExternalSecret: |
      local health = {
        status = "Progressing",
        message = "Waiting for credential synchronization"
      }

      if obj.status and obj.status.conditions then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            health.message = condition.message or condition.reason or ""

            if condition.status == "True" then
              health.status = "Healthy"
            elseif condition.status == "False" then
              health.status = "Degraded"
            end

            return health
          end
        end
      end

      return health

    resource.customizations.health.cert-manager.io_Certificate: |
      local health = {
        status = "Progressing",
        message = "Waiting for certificate issuance"
      }

      if obj.status and obj.status.conditions then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.observedGeneration and
               condition.observedGeneration ~= obj.metadata.generation then
              return health
            end

            health.message = condition.message or condition.reason or ""

            if condition.status == "True" then
              health.status = "Healthy"
            end

            return health
          end
        end
      end

      return health


  params:
    server.insecure: true

global:
  domain: argocd.brokecart.com

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

repoServer:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

dex:
  enabled: false
