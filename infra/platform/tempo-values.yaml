replicas: 1

tempo:
  reportingEnabled: false
  retention: 24h

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  extraEnv:
    - name: GOMEMLIMIT
      value: "800MiB"

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  querier:
    max_concurrent_queries: 2

  metricsGenerator:
    enabled: false

persistence:
  enabled: true
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  size: 5Gi

serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
