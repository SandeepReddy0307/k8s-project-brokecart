kind: DaemonSet

serviceAccount:
  create: true

rbac:
  create: true

tolerations:
  - operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

testFramework:
  enabled: false

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: fluentbit-state
    hostPath:
      path: /var/lib/fluent-bit
      type: DirectoryOrCreate

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: fluentbit-state
    mountPath: /var/lib/fluent-bit

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
        storage.path /var/lib/fluent-bit/buffer
        storage.sync normal
        storage.backlog.mem_limit 10M

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Exclude_Path /var/log/containers/*_observability_fluent-bit-*.log
        Tag kube.*
        multiline.parser cri
        DB /var/lib/fluent-bit/tail.db
        Read_from_Head On
        Refresh_Interval 10
        Skip_Long_Lines On
        storage.type filesystem

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log Off
        Labels Off
        Annotations Off
        Buffer_Size 0

  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki-gateway.observability.svc.cluster.local
        Port 80
        URI /loki/api/v1/push
        Labels job=fluent-bit,cluster=brokecart,namespace=$kubernetes['namespace_name'],pod=$kubernetes['pod_name'],container=$kubernetes['container_name']
        Auto_Kubernetes_Labels Off
        Line_Format json
        Retry_Limit False
        storage.total_limit_size 100M
