apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao-ui
  namespace: openbao
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/preserve-host: "false"
spec:
  parentRefs:
    - name: brokecart-gateway
      namespace: kong
      sectionName: https
  hostnames:
    - openbao.brokecart.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openbao-ui
          port: 8200
