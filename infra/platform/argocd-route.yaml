apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: brokecart-gateway
      namespace: kong
      sectionName: https
  hostnames: [argocd.brokecart.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: argocd-server
          port: 80
