apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kong
  annotations:
    konghq.com/gatewayclass-unmanaged: "true"
spec:
 controllerName: konghq.com/kic-gateway-controller

---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
 name: brokecart-gateway
 namespace: kong
spec:
 gatewayClassName: kong
 listeners:
 - name: http
   protocol: HTTP
   port: 80
   allowedRoutes:
    namespaces:
      from: All
 - name: https
   protocol: HTTPS
   port: 443
   tls:
     mode: Terminate
     certificateRefs:
     - kind: Secret
       name: brokecart-gateway-tls
   allowedRoutes:
     namespaces:
        from: All
