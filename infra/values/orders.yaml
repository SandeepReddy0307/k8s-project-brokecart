# Per-service settings; GitHub Actions replaces the image repository and tag.
openbao:
  role: orders-secrets
  serviceAccount: orders-secrets
  credentialPath: brokecart/orders/database
deployment:
  enabled: true
  replicas: 1
monitoring:
  enabled: true
image:
  repository: "docker.io/sandeep030701/brokecart-orders"
  tag: "2655e3a2b8c08741692e858c194dc6d161f89655"
database:
  secretName: orders-database-credentials
security:
  enabled: true
  secretName: orders-application-security
  identitySigningKey: false
  openbao:
    role: orders-application-secrets
    serviceAccount: orders-application-secrets
kafka:
  enabled: true
  secretName: orders-kafka-credentials
  openbao:
    role: orders-kafka-secrets
    serviceAccount: orders-kafka-secrets
    credentialPath: brokecart/orders/kafka
config:
  PORT: '8080'
  PUBLIC_ORIGIN: https://brokecart.com:8443
  REDIS_ENABLED: 'false'
  TRACE_SAMPLE_RATE: '0.1'
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  KAFKA_BOOTSTRAP_SERVERS: kafka.brokecart-kafka.svc.cluster.local:9092
  CATALOG_URL: http://catalog.brokecart-catalog.svc.cluster.local
  PRICING_URL: http://pricing.brokecart-pricing.svc.cluster.local
  IDENTITY_URL: http://identity.brokecart-identity.svc.cluster.local
  CART_URL: http://cart.brokecart-cart.svc.cluster.local
  CHECKOUT_URL: http://checkout.brokecart-checkout.svc.cluster.local
  INVENTORY_URL: http://inventory.brokecart-inventory.svc.cluster.local
  PAYMENTS_URL: http://payments.brokecart-payments.svc.cluster.local
  PAYMENT_PROVIDER_URL: http://payment-provider.brokecart-payment-provider.svc.cluster.local
  SHIPPING_URL: http://shipping.brokecart-shipping.svc.cluster.local
  RETURNS_URL: http://returns.brokecart-returns.svc.cluster.local
  NOTIFICATIONS_URL: http://notifications.brokecart-notifications.svc.cluster.local
  SEARCH_URL: http://search.brokecart-search.svc.cluster.local
  REPORTING_URL: http://reporting.brokecart-reporting.svc.cluster.local
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  maxUnavailable: 1
route:
  enabled: true
  paths:
  - /api/orders
  - /api/operations/orders
