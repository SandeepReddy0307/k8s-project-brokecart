{{- range .Values.auth.clients }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "kafka-client-%s" . | quote }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: {{ printf "kafka-client-%s" . | quote }}
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: {{ printf "brokecart/%s/kafka" . | quote }}
        property: username

    - secretKey: password
      remoteRef:
        key: {{ printf "brokecart/%s/kafka" . | quote }}
        property: password
{{- end }}
