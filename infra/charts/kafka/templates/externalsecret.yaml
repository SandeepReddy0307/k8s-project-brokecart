apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-broker-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: {{ .Values.auth.existingSecret | quote }}
    creationPolicy: Owner

  data:
    - secretKey: keystore-password
      remoteRef:
        key: {{ .Values.openbao.credentialPath | quote }}
        property: keystore-password

    - secretKey: admin-username
      remoteRef:
        key: brokecart/kafka/admin
        property: username

    - secretKey: admin-password
      remoteRef:
        key: brokecart/kafka/admin
        property: password
