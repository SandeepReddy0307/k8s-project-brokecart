{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - brokecart-catalog
          - brokecart-inventory
          - brokecart-orders
          - brokecart-payments
          - brokecart-shipping
          - brokecart-returns
          - brokecart-notifications
          - brokecart-search
          - brokecart-reporting
          - brokecart-kafka-ui
          - brokecart-kafka
    ports:
    - protocol: TCP
      port: 9092
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9093
    - protocol: TCP
      port: 9094
{{- end }}
