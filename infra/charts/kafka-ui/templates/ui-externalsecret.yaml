apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-ui-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: kafka-ui-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.openbao.credentialPath | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.openbao.credentialPath | quote }}
        property: password
