apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-ui
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    konghq.com/strip-path: "false"
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayName | quote }}
      namespace: {{ .Values.route.gatewayNamespace | quote }}
      sectionName: {{ .Values.route.listener | quote }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ index .Values "kafka-ui" "fullnameOverride" | quote }}
          port: {{ index .Values "kafka-ui" "service" "port" }}
