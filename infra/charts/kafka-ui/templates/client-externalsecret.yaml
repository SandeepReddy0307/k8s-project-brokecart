apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-ui-client
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: kafka-ui-client
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        sasl-jaas-config: {{ `{{ printf "org.apache.kafka.common.security.plain.PlainLoginModule required username=%q password=%q;" .username .password }}` | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.openbao.kafkaCredentialPath | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.openbao.kafkaCredentialPath | quote }}
        property: password
