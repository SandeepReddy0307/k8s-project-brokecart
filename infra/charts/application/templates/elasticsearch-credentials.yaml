{{- $dependency := index .Values "elasticsearch" }}
{{- if $dependency.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "elasticsearch.openbao.serviceAccount is required" $dependency.openbao.serviceAccount | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ printf "%s-elasticsearch-openbao" .Release.Name | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: {{ .Values.openbao.server | quote }}
      path: {{ .Values.openbao.mount | quote }}
      version: v2
      caBundle: {{ required "Missing files/openbao-ca.crt" (.Files.Get "files/openbao-ca.crt") | b64enc | quote }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ required "elasticsearch.openbao.role is required" $dependency.openbao.role | quote }}
          serviceAccountRef:
            name: {{ $dependency.openbao.serviceAccount | quote }}
            audiences: [vault]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "elasticsearch.secretName is required" $dependency.secretName | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ printf "%s-elasticsearch-openbao" .Release.Name | quote }}
    kind: SecretStore
  target:
    name: {{ $dependency.secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "elasticsearch.openbao.credentialPath is required" $dependency.openbao.credentialPath | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ required "elasticsearch.openbao.credentialPath is required" $dependency.openbao.credentialPath | quote }}
        property: password
{{- end }}
