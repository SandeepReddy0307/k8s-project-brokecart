{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "kafka.openbao.serviceAccount is required" .Values.kafka.openbao.serviceAccount | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
{{- end }}
