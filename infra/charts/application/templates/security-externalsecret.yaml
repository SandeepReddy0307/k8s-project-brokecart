{{- if .Values.security.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "security.secretName is required" .Values.security.secretName | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ printf "%s-security-openbao" .Release.Name | quote }}
    kind: SecretStore
  target:
    name: {{ .Values.security.secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: internal-token
      remoteRef:
        key: {{ .Values.security.openbao.internalTokenPath | quote }}
        property: token
    - secretKey: jwt-public-key
      remoteRef:
        key: {{ .Values.security.openbao.jwtPublicPath | quote }}
        property: public-key
    {{- if .Values.security.identitySigningKey }}
    - secretKey: jwt-private-key
      remoteRef:
        key: {{ .Values.security.openbao.jwtPrivatePath | quote }}
        property: private-key
    {{- end }}
{{- end }}
