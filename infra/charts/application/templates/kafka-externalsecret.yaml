{{- if .Values.kafka.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "kafka.secretName is required" .Values.kafka.secretName | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ printf "%s-kafka-openbao" .Release.Name | quote }}
    kind: SecretStore
  target:
    name: {{ .Values.kafka.secretName | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        sasl-jaas-config: {{ `{{ printf "org.apache.kafka.common.security.plain.PlainLoginModule required username=%q password=%q;" .username .password }}` | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "kafka.openbao.credentialPath is required" .Values.kafka.openbao.credentialPath | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.kafka.openbao.credentialPath | quote }}
        property: password
{{- end }}
