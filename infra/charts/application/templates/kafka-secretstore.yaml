{{- if .Values.kafka.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ printf "%s-kafka-openbao" .Release.Name | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: {{ .Values.openbao.server | quote }}
      path: {{ .Values.openbao.mount | quote }}
      version: v2
      caBundle: {{ required "Missing files/openbao-ca.crt" (.Files.Get "files/openbao-ca.crt") | b64enc | quote }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ required "kafka.openbao.role is required" .Values.kafka.openbao.role | quote }}
          serviceAccountRef:
            name: {{ required "kafka.openbao.serviceAccount is required" .Values.kafka.openbao.serviceAccount | quote }}
            audiences: [vault]
{{- end }}
