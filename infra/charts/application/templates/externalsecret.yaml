apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: {{ .Values.database.secretName | quote }}
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.openbao.credentialPath | quote }}
        property: username

    - secretKey: password
      remoteRef:
        key: {{ .Values.openbao.credentialPath | quote }}
        property: password

    - secretKey: database
      remoteRef:
        key: {{ .Values.openbao.credentialPath | quote }}
        property: database
