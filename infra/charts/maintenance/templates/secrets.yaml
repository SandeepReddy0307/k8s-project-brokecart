apiVersion: v1
kind: ServiceAccount
metadata:
  name: maintenance
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.openbao.serviceAccount }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: maintenance-openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: {{ .Values.openbao.server | quote }}
      path: {{ .Values.openbao.mount | quote }}
      version: v2
      caBundle: {{ required "Missing public OpenBao CA" (.Files.Get "files/openbao-ca.crt") | b64enc | quote }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.openbao.role }}
          serviceAccountRef:
            name: {{ .Values.openbao.serviceAccount }}
            audiences: [vault]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef: {name: maintenance-openbao, kind: SecretStore}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: internal-token
      remoteRef:
        key: {{ .Values.openbao.credentialPath }}
        property: token
