{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maintenance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maintenance
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        {{- range $service := list "inventory" "payments" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: brokecart-{{ $service }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $service }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 8080}
{{- end }}
