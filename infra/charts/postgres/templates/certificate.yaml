apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.tls.secretName | quote }}
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - postgres
    - postgres.{{ .Release.Namespace }}.svc
    - postgres.{{ .Release.Namespace }}.svc.cluster.local
    - postgres-0.postgres-headless.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: {{ .Values.tls.clusterIssuer | quote }}
    kind: ClusterIssuer
