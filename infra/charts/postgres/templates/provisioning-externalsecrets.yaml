{{- if .Values.provisioning.enabled }}
{{- range .Values.provisioning.services }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-database-credentials" . | quote }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: openbao-provisioning
    kind: SecretStore

  target:
    name: {{ printf "%s-database-credentials" . | quote }}
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: {{ printf "brokecart/%s/database" . | quote }}
        property: username

    - secretKey: password
      remoteRef:
        key: {{ printf "brokecart/%s/database" . | quote }}
        property: password

    - secretKey: database
      remoteRef:
        key: {{ printf "brokecart/%s/database" . | quote }}
        property: database
{{- end }}
{{- end }}
