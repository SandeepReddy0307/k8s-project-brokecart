apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: {{ .Values.openbao.server | quote }}
      path: {{ .Values.openbao.mount | quote }}
      version: v2
      caBundle: {{ required "Missing files/openbao-ca.crt" (.Files.Get "files/openbao-ca.crt") | b64enc | quote }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.openbao.role | quote }}
          serviceAccountRef:
            name: {{ .Values.openbao.serviceAccount | quote }}
            audiences:
              - vault
