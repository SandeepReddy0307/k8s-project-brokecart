apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: redis-headless
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name | quote }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}

    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command: ["/bin/sh", "-ec"]
          args:
            - |
              case "$REDISCLI_AUTH" in
                ""|*[!a-fA-F0-9]*)
                  echo "Redis password must be a nonempty hexadecimal value" >&2
                  exit 1
                  ;;
              esac

              umask 077
              cp /etc/redis-config/redis.conf /tmp/redis.conf
              printf '\nrequirepass %s\n' "$REDISCLI_AUTH" >> /tmp/redis.conf

              exec redis-server /tmp/redis.conf

          ports:
            - name: redis
              containerPort: 6379

          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: password

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'test "$(redis-cli --raw -h 127.0.0.1 ping)" = PONG'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'test "$(redis-cli --raw -h 127.0.0.1 ping)" = PONG'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'test "$(redis-cli --raw -h 127.0.0.1 ping)" = PONG'
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          volumeMounts:
            - name: data
              mountPath: /data

            - name: config
              mountPath: /etc/redis-config
              readOnly: true

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: redis-config

        - name: tmp
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storage.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.storage.size | quote }}
