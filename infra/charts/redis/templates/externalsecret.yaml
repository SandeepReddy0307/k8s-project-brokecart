
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: {{ .Values.auth.existingSecret | quote }}
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.openbao.credentialPath | quote }}
        property: password
