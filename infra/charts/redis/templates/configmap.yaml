apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode yes

    dir /data

    appendonly {{ ternary "yes" "no" .Values.redis.appendonly }}
    appendfsync {{ .Values.redis.appendfsync }}

    save ""

    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy {{ .Values.redis.maxmemoryPolicy }}

    logfile ""
    daemonize no
