image:
  repository: redis
  tag: "7.4.11-alpine3.21"
  pullPolicy: IfNotPresent

auth:
  existingSecret: redis-auth

openbao:
  server: https://openbao.openbao.svc:8200
  mount: secret
  role: redis-secrets
  serviceAccount: redis-secrets
  credentialPath: brokecart/redis/auth

storage:
  storageClassName: standard
  size: 2Gi

redis:
  maxmemory: 128mb
  maxmemoryPolicy: noeviction
  appendonly: true
  appendfsync: everysec

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi


networkPolicy:
  enabled: true
