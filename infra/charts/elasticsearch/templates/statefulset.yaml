apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: elasticsearch
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "/scripts/prepare-config.sh"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config, mountPath: /work-config}
            - {name: settings, mountPath: /settings, readOnly: true}
            - {name: scripts, mountPath: /scripts, readOnly: true}
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/scripts/start.sh"]
          env:
            - name: ES_JAVA_OPTS
              value: {{ printf "%s -XX:ActiveProcessorCount=2" .Values.heap | quote }}
          ports:
            - {name: https, containerPort: 9200}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["/bin/sh", "/scripts/check-ready.sh"]
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "/scripts/check-ready.sh"]
            periodSeconds: 10
            timeoutSeconds: 8
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
            - {name: config, mountPath: /usr/share/elasticsearch/config}
            - {name: logs, mountPath: /usr/share/elasticsearch/logs}
            - {name: tmp, mountPath: /tmp}
            - {name: tls, mountPath: /usr/share/elasticsearch/config/tls, readOnly: true}
            - {name: admin, mountPath: /auth/admin, readOnly: true}
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: settings
          configMap:
            name: elasticsearch-config
        - name: scripts
          configMap:
            name: elasticsearch-scripts
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName | quote }}
            defaultMode: 0440
        - name: admin
          secret:
            secretName: {{ .Values.auth.adminSecret | quote }}
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storage.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.storage.size | quote }}
