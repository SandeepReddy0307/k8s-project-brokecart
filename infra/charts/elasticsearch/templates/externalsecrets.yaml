{{- range $item := list (dict "name" .Values.auth.adminSecret "path" .Values.openbao.adminPath) (dict "name" .Values.auth.searchSecret "path" .Values.openbao.searchPath) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name | quote }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: {{ $item.name | quote }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ $item.path | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $item.path | quote }}
        property: password
{{- end }}
