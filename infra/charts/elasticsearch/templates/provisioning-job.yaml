apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-provisioning
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-provisioning
    spec:
      serviceAccountName: elasticsearch
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: provision
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "/scripts/provision.sh"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: admin, mountPath: /auth/admin, readOnly: true}
            - {name: search, mountPath: /auth/search, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: elasticsearch-scripts
        - name: admin
          secret:
            secretName: {{ .Values.auth.adminSecret | quote }}
            defaultMode: 0440
        - name: search
          secret:
            secretName: {{ .Values.auth.searchSecret | quote }}
            defaultMode: 0440
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName | quote }}
            items:
              - {key: ca.crt, path: ca.crt}
        - name: tmp
          emptyDir: {}
