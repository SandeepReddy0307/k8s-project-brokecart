apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brokecart-search
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  destination:
    namespace: brokecart-search
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      releaseName: search
      valueFiles:
      - ../../values/search.yaml
    path: infra/charts/application
    repoURL: https://github.com/SandeepReddy0307/k8s-project-brokecart.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
