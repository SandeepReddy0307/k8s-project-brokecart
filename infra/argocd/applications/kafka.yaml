apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brokecart-kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  source:
    repoURL: https://github.com/SandeepReddy0307/k8s-project-brokecart.git
    targetRevision: main
    path: infra/charts/kafka
    helm:
      releaseName: kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: brokecart-kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
