apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brokecart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SandeepReddy0307/k8s-project-brokecart.git
    targetRevision: main
    path: infra/argocd/applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
